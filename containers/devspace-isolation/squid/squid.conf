# Deny-by-default egress proxy for the DevSpace isolation container.
# See docs/specs/devspace-isolation-container-framework.md.

http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Reject anything outside the ports a normal HTTP(S) client needs before
# even considering the domain allowlist.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Only requests whose destination domain is in allowed-domains.txt succeed.
# Everything else is denied -- this is the default-deny posture the spec
# requires, not an oversight.
http_access allow allowed_domains
http_access deny all

coredump_dir /var/spool/squid
