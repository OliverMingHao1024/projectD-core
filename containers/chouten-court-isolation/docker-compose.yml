# Second instance of the DevSpace isolation framework, bound to a different
# repo (chouten-court) than containers/devspace-isolation (projectD-core).
# Same posture, same security review conclusions -- see
# docs/specs/devspace-isolation-container-framework.md; this file only
# differs from the projectD-core instance in container_name (Docker-global,
# must not collide) and the published host port (127.0.0.1:7677 instead of
# 7676, since both instances are meant to run at the same time without
# interfering with each other). Compose network names below are NOT renamed
# -- they get this project's own directory-derived prefix automatically
# (chouten-court-isolation_devspace-internal, etc.), so they never collide
# with the projectD-core instance's networks even with identical names here.

services:
  devspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chouten-court-isolated
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DEVSPACE_OAUTH_OWNER_TOKEN: "${DEVSPACE_OAUTH_OWNER_TOKEN}"
      DEVSPACE_ISOLATION_PUBLIC_BASE_URL: "${DEVSPACE_PUBLIC_BASE_URL:-}"
      HTTP_PROXY: "http://egress-proxy:3128"
      HTTPS_PROXY: "http://egress-proxy:3128"
      NO_PROXY: "egress-proxy"
    volumes:
      - ${DEVSPACE_REPO_PATH}:/workspace:rw
      - chouten-court-devspace-config:/home/devspace
    networks:
      - devspace-internal
    depends_on:
      - egress-proxy
    restart: "no"

  egress-proxy:
    image: ubuntu/squid:latest
    container_name: chouten-court-egress-proxy
    # Starts already as uid/gid 13 (squid's own "proxy" user) so squid never
    # calls setgid/initgroups on itself -- that internal call is what needed
    # CAP_SETGID before. See docs/specs/devspace-isolation-container-framework.md
    # for the full diagnosis and live verification (this is the same fix
    # applied to the projectD-core instance).
    user: "13:13"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/spool/squid:mode=1777
      - /var/log/squid:mode=1777
      - /var/run:mode=1777
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    networks:
      devspace-internal:
      devspace-egress:
    restart: "no"

  port-forward:
    image: alpine/socat:latest
    container_name: chouten-court-port-forward
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    command: ["tcp-listen:7676,fork,reuseaddr", "tcp-connect:chouten-court-isolated:7676"]
    ports:
      # 7677, not 7676 -- the projectD-core instance already owns 7676 on
      # host loopback; both instances run concurrently without interfering.
      - "127.0.0.1:7677:7676"
    networks:
      - devspace-internal
      - devspace-egress
    depends_on:
      - devspace
    restart: "no"

networks:
  devspace-internal:
    internal: true
  devspace-egress:
    driver: bridge

volumes:
  chouten-court-devspace-config:
