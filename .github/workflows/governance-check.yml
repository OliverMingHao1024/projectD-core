name: Governance check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  repository-governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run governance hook contract
        shell: pwsh
        run: ./scripts/tests/governance-hook.contract.ps1
      - name: Run portable repository checks
        shell: pwsh
        run: >-
          ./scripts/projectd-check.ps1
          -SkipFleet
          -SkipGlobal
          -SkipWiring
