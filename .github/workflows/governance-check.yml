name: Governance check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --results=verified,unknown

  repository-governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify line-ending normalization
        shell: pwsh
        run: |
          git add --renormalize .
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git diff --cached --name-only
            throw "Tracked files are not normalized according to .gitattributes."
          }
      - name: Run governance hook contract
        shell: pwsh
        run: ./scripts/tests/governance-hook.contract.ps1
      - name: Run governance eval contract
        shell: pwsh
        run: ./scripts/tests/governance-eval.contract.ps1
      - name: Run governance behavior eval contract
        shell: pwsh
        run: ./scripts/tests/governance-behavior-eval.contract.ps1
      - name: Run governance asset inventory contract
        shell: pwsh
        run: ./scripts/tests/governance-asset-inventory.contract.ps1
      - name: Run governance security trace contract
        shell: pwsh
        run: ./scripts/tests/governance-trace-eval.contract.ps1
      - name: Run portable repository checks and heavy governance contracts
        shell: pwsh
        run: >-
          ./scripts/projectd-check.ps1
          -SkipFleet
          -SkipGlobal
          -SkipWiring
          -GovernanceEvals
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Python test tooling
        run: python -m pip install --quiet ruff pytest pytest-cov
      - name: Lint (ruff)
        run: python -m ruff check tests/
      - name: Python contract tests with coverage
        run: python -m pytest tests/ --cov=tests --cov-report=term-missing
