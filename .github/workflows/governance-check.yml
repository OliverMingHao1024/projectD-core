name: Governance check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  repository-governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run governance hook contract
        shell: pwsh
        run: ./scripts/tests/governance-hook.contract.ps1
      - name: Run governance eval contract
        shell: pwsh
        run: ./scripts/tests/governance-eval.contract.ps1
      - name: Run governance behavior eval contract
        shell: pwsh
        run: ./scripts/tests/governance-behavior-eval.contract.ps1
      - name: Run governance asset inventory contract
        shell: pwsh
        run: ./scripts/tests/governance-asset-inventory.contract.ps1
      - name: Run governance security trace contract
        shell: pwsh
        run: ./scripts/tests/governance-trace-eval.contract.ps1
      - name: Run governance host trial contract
        shell: pwsh
        run: ./scripts/tests/governance-host-trial.contract.ps1
      - name: Run governance durable operation-log contract
        shell: pwsh
        run: ./scripts/tests/governance-operation-log.contract.ps1
      - name: Run Codex and Claude pre-effect hook contract
        shell: pwsh
        run: ./scripts/tests/governance-host-operation-hook.contract.ps1
      - name: Run governance host upgrade gate contract
        shell: pwsh
        run: ./scripts/tests/governance-host-upgrade-gate.contract.ps1
      - name: Run Claude governance run-plan contract
        shell: pwsh
        run: ./scripts/tests/governance-host-run-plan.contract.ps1
      - name: Run portable repository checks
        shell: pwsh
        run: >-
          ./scripts/projectd-check.ps1
          -SkipFleet
          -SkipGlobal
          -SkipWiring
          -GovernanceEvals
